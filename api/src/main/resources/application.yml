server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: hall-of-fame-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:hall_of_fame}}
    username: ${DB_USERNAME:${PGUSER:hof_user}}
    password: ${DB_PASSWORD:${PGPASSWORD:hof_dev_password}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-256-bit-secret-key-for-hall-of-fame}
    expiry-seconds: ${JWT_EXPIRY_SECONDS:3600}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me-dev-password}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:./uploads}
    max-upload-bytes: ${MAX_UPLOAD_BYTES:5242880}
